# Railway config for the Diktiax backend service (FalkorDB runs as a separate
# image service; see README "Deploy"). Build context is the repo
# root because backend/src/db/seed.rs embeds data/seed.cypher at compile time.
[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
