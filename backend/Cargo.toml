[package]
name = "diktiax-backend"
version = "0.1.0"
edition = "2021"
authors = ["Prabal Patra <prabalpatra@users.noreply.github.com>"]
description = "Diktiax - Autonomous Insurance Fraud Investigator Agent in Rust powered by FalkorDB"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5.3" }
tower-http = { version = "0.7", features = ["cors", "trace"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.28", features = ["v4", "serde"] }
falkordb = { version = "0.10.4", features = ["tokio"] }
# Already pulled in by falkordb (same version); used directly only for ACL SETUSER.
redis = { version = "1.7", default-features = false, features = ["tokio-comp"] }
sha2 = "0.11"
hex = "0.4.3"
futures-core = "0.3.34"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
