[package]
name = "claimgraph-backend"
version = "0.1.0"
edition = "2021"
authors = ["Prabal Patra <prabalpatra@users.noreply.github.com>"]
description = "Diktiax - Autonomous Insurance Fraud Investigator Agent in Rust powered by FalkorDB"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
falkordb = { version = "0.10.4", features = ["tokio"] }
sha2 = "0.10"
hex = "0.4"
futures-core = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
