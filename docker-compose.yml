services:
  # FalkorDB: the graph database Diktiax reads and writes
  falkordb:
    image: falkordb/falkordb:v4.22.1
    container_name: diktiax-falkordb
    ports:
      # Loopback only: FalkorDB has no password in local dev, so never publish it on all interfaces.
      - "127.0.0.1:6379:6379"
    volumes:
      - falkordb-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional graph explorer: docker compose --profile browser up -d falkordb-browser
  # Served on 3002 because the Diktiax frontend uses 3000.
  falkordb-browser:
    image: falkordb/falkordb-browser:latest
    container_name: diktiax-browser
    profiles: ["browser"]
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - FALKORDB_URL=falkor://falkordb:6379
    depends_on:
      - falkordb
    restart: unless-stopped

volumes:
  falkordb-data:
